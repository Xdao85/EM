<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Electromagnetics Course · Học phần Trường điện từ</title>
<script>
  /* Open the portal in the last language chosen (EN by default). A link such as index.html#/topic1/phasors.html keeps its page. */
  (function () {
    var lang = 'en';
    try { if (localStorage.getItem('em-lang') === 'vi') lang = 'vi'; } catch (e) {}
    if (!/[?&]choose\b/.test(location.search)) location.replace(lang + '/index.html' + location.hash);
  })();
</script>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; font-family: Inter, system-ui, sans-serif; background: #fff; color: #0f172a; }
  main { text-align: center; padding: 24px; }
  h1 { font-size: 1.5rem; margin: 0 0 .25rem; }
  p { color: #475569; margin: 0 0 1.5rem; }
  a { display: inline-block; margin: .35rem; padding: .8rem 1.4rem; border-radius: .75rem; border: 1px solid #cbd5e1; color: #0f172a; text-decoration: none; font-weight: 600; }
  a:hover { background: #f1f5f9; }
  a:focus-visible { outline: 2px solid #0284c7; outline-offset: 2px; }
</style>
</head>
<body>
<main>
  <h1>Electromagnetics Course · Học phần Trường điện từ</h1>
  <p>Choose a language · Chọn ngôn ngữ</p>
  <a href="en/index.html" lang="en" onclick="try{localStorage.setItem('em-lang','en')}catch(e){}">English</a>
  <a href="vi/index.html" lang="vi" onclick="try{localStorage.setItem('em-lang','vi')}catch(e){}">Tiếng Việt</a>
</main>
</body>
</html>
